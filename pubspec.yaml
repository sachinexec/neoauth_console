name: neoauth_console
description: "Management console for the central auth service."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  neoauth:
    git:
      url: https://github.com/sachinexec/neoauth.git
      ref: v0.2.0
  # Top-left flavor ribbon on every route of a debug run. A NeoKit package
  # that depends on Flutter only.
  neokit_flavor_banner:
    git:
      url: https://github.com/sachinexec/neokit.git
      ref: 28ede05f5a7bafcc937560b29cb04a3a1404f7fe # v0.2.1
      path: flutter/packages/neokit_flavor_banner
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Per-flavor launcher icons from assets/branding/ (flutter_launcher_icons-<flavor>.yaml).
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Per-flavor config, picked at startup by --flavor (see lib/core/config.dart).
  # Each build bundles only its own file, so prod never ships dev endpoints.
  assets:
    - path: .env.dev
      flavors: [dev]
    - path: .env.prod
      flavors: [prod]
