name: neoauth_console
description: "Management console for the central auth service."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  neoauth:
    path: ../neoauth
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Per-flavor config, picked at startup by --flavor (see lib/core/config.dart).
  # Each build bundles only its own file, so prod never ships dev endpoints.
  assets:
    - path: .env.dev
      flavors: [dev]
    - path: .env.prod
      flavors: [prod]
